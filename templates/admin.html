<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EasyType 设备管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="shell narrow-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">仅限本机</p>
                <h1>设备配对与管理</h1>
            </div>
            <a class="text-link" href="/">返回文本板</a>
        </header>

        <section class="panel">
            <div class="section-heading">
                <div>
                    <h2>配对新设备</h2>
                    <p>手机连接同一个家庭 Wi‑Fi 后，扫描二维码完成授权。</p>
                </div>
                <button id="newPairingButton" class="button primary" type="button">生成配对码</button>
            </div>

            <div id="pairingEmpty" class="empty-state">
                配对码五分钟内有效，并且只能使用一次。
            </div>
            <div id="pairingCard" class="pairing-card" hidden>
                <img id="pairingQr" alt="手机配对二维码" width="240" height="240">
                <div>
                    <p class="field-label">手机访问地址</p>
                    <p id="pairingUrl" class="code-value"></p>
                    <p id="pairingExpiry" class="muted"></p>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="section-heading">
                <div>
                    <h2>已授权设备</h2>
                    <p>撤销后，该设备会立即断开并需要重新配对。</p>
                </div>
            </div>
            <div id="deviceList" class="device-list">
                <div class="empty-state">正在读取设备……</div>
            </div>
        </section>

        <div id="toast" class="toast" hidden aria-live="polite"></div>
    </main>
    <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</body>
</html>
